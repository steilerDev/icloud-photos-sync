# Making sure dependencies are kept up-to-date
# Updates are grouped to keep the number of PRs manageable - a dependency is assigned to the first group matching it.
# Major updates are raised individually (unless part of a coordinated group), so breaking changes can be reviewed in isolation.
# A cooldown delays updates of freshly published versions, reducing churn and supply chain risk.
version: 2
registries:
  # Docker Hardened Images require authentication with a Docker Hub account - DOCKER_TOKEN needs to be available as Dependabot secret
  dhi:
    type: docker-registry
    url: dhi.io
    username: steilerdev
    password: ${{secrets.DOCKER_TOKEN}}
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    labels: [ ]
    directories:
      - "/"                     # to match /.github/workflows
      - "/.github/actions/**/*" # to match repository actions
    target-branch: "dev"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore: [ci] "
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # A single PR for all actions across all directories
      github-actions:
        patterns:
        - "*"

  # Maintain dependencies for devcontainer
  - package-ecosystem: "devcontainers"
    labels: [ ]
    directory: "/"
    target-branch: "dev"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore: [dev] "
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Europe/Berlin"
    groups:
      devcontainer:
        patterns:
        - "*"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    labels: [ ]
    directory: "/app"
    target-branch: "dev"
    versioning-strategy: "increase"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore: [app] "
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # Types need to match the Node.js runtime (app/node-version), which is updated manually
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is not yet supported by typescript-eslint and ts-jest
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Coordinated groups - these packages need to be updated together (including major versions)
      typescript:
        patterns:
        - "typescript"
        - "typescript-eslint"
        - "@typescript-eslint/*"
        - "eslint"
        - "@eslint/*"
        - "@stylistic/*"
        - "tsx"
      jest:
        patterns:
        - "jest"
        - "jest-*"
        - "@jest/*"
        - "@types/jest"
        - "ts-jest"
      jsdom:
        patterns:
        - "jsdom"
        - "@types/jsdom"
        - "@testing-library/*"
      backtrace:
        patterns:
        - "@backtrace/*"
      # Catch-all groups for non-breaking updates
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    labels: [ ]
    directory: "/docker"
    registries:
      - dhi
    target-branch: "dev"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore: [docker] "
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    ignore:
      # Node.js major versions are updated manually together with the runtime (app/node-version)
      - dependency-name: "*node"
        update-types: ["version-update:semver-major"]
    groups:
      # The application is installed by the builder stage and executed by the runtime stage - both need to use the same Node.js version
      base-images:
        patterns:
        - "*node"

  # pip (docs site) is intentionally not maintained: the docs toolchain is frozen in docs/requirements.txt (see #1118)

  # Maintain dependencies for semantic release
  - package-ecosystem: "npm"
    labels: [ ]
    directory: "/.github/actions/helper/prepare-semantic-release"
    target-branch: "dev"
    versioning-strategy: "increase"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore: [semantic-release] "
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # Version 10 requires conventional-changelog-writer 9, while @semantic-release/release-notes-generator still uses version 8
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">= 10"]
      # Version 8 passes boolean flags (provenance / attest) through to buildx - requires validation of the release output
      - dependency-name: "@codedependant/semantic-release-docker"
        versions: [">= 8"]
    groups:
      semantic-release:
        patterns:
        - "*"
