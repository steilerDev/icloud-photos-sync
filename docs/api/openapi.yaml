openapi: '3.1.0'
info:
  title: icloud-photos-sync local server API
  version: '1.0'
  license: 
    name: GNU General Public License v3.0
    url: https://github.com/steilerDev/icloud-photos-sync/blob/main/LICENSE
  description: This document describes the API of icloud-photo-sync's web server
servers:
  - url: http://localhost:80
    description: The URL and port depend on your local setup - by default the webserver is exposed at port 80
security: 
  -  {}
paths:
  /api/state:
    get: 
      summary: Provides the current operational state of the application's
      operationId: getState
      responses: 
        '200':
          description: Returns the current state
          content: 
            application/json:
              schema: 
                type: object
                required: ['state', 'timestamp']
                properties: 
                  state: 
                    type: string
                    enum: ['ready', 'running', 'blocked']
                  timestamp:
                    type: number
                  nextSync:
                    type: number
                  prevError:
                    type: object
                    properties:
                      message:
                        type: string
                      code:
                        type: string
                  prevTrigger:
                    type: string
                    enum: ['sync', 'auth']
                  progressMsg:
                    type: string
                  progress:
                    type: number
  /api/log:
    get:
      summary: Provides all stored log entries since the last trigger
      operationId: getLog
      parameters: 
        - name: loglevel
          in: query
          description: The selected log level to be returned by the response, defaults to 'none'
          schema: 
            type: string
            enum: ['none', 'debug', 'info','warn', 'error']
      responses:
        '200':
          description: Returns the logs
          content:
            application/json:
              schema:
                type: array
                items: 
                  type: object
                  properties:
                    level:
                      type: string
                      enum: ['debug', 'info','warn', 'error']
                    time:
                      type: number
                    source: 
                      type: string
                    message: 
                      type: string
  /api/reauthenticate:
    post: 
      summary: Requests the application to re-authenticate
      operationId: requestReAuthentication
      responses: 
        '200':
          description: Successfully triggered re-authentication
          content: 
            application/json:
              schema:
              type: object
              properties:
                message:
                  type: string
                  enum: ['Reauthentication requested']
  /api/sync:
    post:
      summary: Requests the application to execute an ad-hoc sync
      operationId: requestSync
      responses: 
        '200':
          description: Successfully triggered an ad-hoc sync
          content: 
            application/json:
              schema:
              type: object
              properties:
                message:
                  type: string
                  enum: ['Sync requested']
  /api/resend_mfa:
    post:
      summary: Requests the tool to resend the MFA code utilizing the provided method
      operationId: postResendMFA
      parameters: 
        - name: method
          in: query
          description: The selected resend method
          required: true
          schema: 
            type: string
            enum: ['sms', 'voice', 'device']
        - name: phoneNumberId
          in: query
          description: Optionally defining a phone number id (in case multiple trusted phone numbers are registered with the account)
          required: false
          schema: 
            type: integer
      responses: 
        '200':
          description: Successfully requested MFA code resend
          content: 
            application/json:
              schema:
              type: object
              properties:
                message:
                  enum: ['Requesting MFA resend with method $method']
        '400':
          description: Resend method does not match expected format
          content: 
            application/json:
              schema:
              type: object
              properties:
                message:
                  type: string
                  enum: ['Resend method does not match expected format']
  /api/mfa:
    post:
      summary: Enters the MFA code for authentication
      operationId: postMFACode
      parameters: 
        - name: code
          in: query
          description: The MFA code provided by the trusted source
          required: true
          schema: 
            type: integer
            maxLength: 6
            minLength: 6
      responses:
        '200':
          description: MFA code read
          content: 
            application/json:
              schema:
              type: object
              properties:
                message:
                  type: string
                  enum: ['Read MFA code: $code']
        '400':
          description: MFA code does not match expected format
          content: 
            application/json:
              schema:
              type: object
              properties:
                message:
                  type: string
                  enum: ['Unexpected MFA code format! Expecting 6 digits']
        '412':
          description: MFA code not expected at this time
          content: 
            application/json:
              schema:
              type: object
              properties:
                message:
                  type: string
                  enum: ['MFA code not expected at this time. Taking you back home.']

  /api/subscribe:
    post:
      summary: Creates a notification subscription
      operationId: postSubscription
      requestBody: 
        content: 
          application/json:
            schema: 
              type: object
              properties: 
                endpoint:
                  type: string
                keys:
                  type: object
                  properties: 
                    p256dh:
                      type: string
                    auth: 
                      type: string
      responses: 
        '200':
          description: Successfully created a notification subscription
          content: 
            application/json:
              schema:
              type: object
              properties:
                message:
                  type: string
                  enum: ['Push subscription added successfully']
        '400':
          description: Invalid notification subscription request
          content: 
            application/json:
              schema:
              type: object
              properties:
                message:
                  type: string
                  enum: ['Invalid request body']
  /api/vapid-public-key:
    get:
      summary: Gets the VAPID public key, required for push notification support
      operationId: getVapidPublicKey
      responses: 
        '200':
          description: The VAPID Public key
          content: 
            application/json:
              schema:
                type: object
                properties:
                  publicKey:
                    type: string
  /metrics:
    get:
      summary: Provides sync metrics in the Prometheus/OpenMetrics exposition format
      description: |
        Only available if the Prometheus metrics export is enabled (`--export-prometheus-metrics`), otherwise the endpoint does not exist and the request is rejected with `400`.
        The exposition format is negotiated through the `Accept` header, following the [Prometheus content negotiation](https://prometheus.io/docs/instrumenting/content_negotiation/): OpenMetrics 1.0.0 and the Prometheus text formats 1.0.0 and 0.0.4 are supported, the Prometheus text format 0.0.4 is used as fallback.
        See the [sync metrics documentation](https://icps.steiler.dev/user-guides/sync-metrics/) for the exposed metrics.
      operationId: getMetrics
      parameters:
        - name: Accept
          in: header
          description: The accepted exposition formats, e.g. as sent by Prometheus
          required: false
          schema:
            type: string
            example: 'application/openmetrics-text;version=1.0.0;escaping=allow-utf-8;q=0.5,text/plain;version=0.0.4;q=0.2,*/*;q=0.1'
      responses:
        '200':
          description: The current metrics, in the negotiated exposition format
          content:
            application/openmetrics-text; version=1.0.0; charset=utf-8:
              schema:
                type: string
            text/plain; version=1.0.0; charset=utf-8:
              schema:
                type: string
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string